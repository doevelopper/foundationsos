# users-table.txt
# Buildroot users table (makeusers syntax)
#
# Fields per line:
#   username uid group gid password home shell groups [comment]
#
# Field rules:
#   username  '-'  => group-only entry (no user created)
#   uid/gid   -1   => auto system ID  (range 100–999)
#   uid/gid   -2   => auto user ID    (range 1000–1999)
#   password  '!'  => account locked; SSH-key login still allowed
#   password  '*'  => login fully disabled (service accounts)
#   home      '-'  => no home directory created (home = '/')
#   shell     '-'  => /bin/false (no interactive login)
#   groups    '-'  => no supplementary groups beyond the primary
#
# Security model:
#   Human users   : UID ≥ 1000, SSH-key-only auth ('!'), minimal groups.
#   Service accts : UID 100–999, no login ('*'), no shell ('-'), least-privilege groups.
#   RBAC groups   : fine-grained capability groups; never assign more than needed.
#   Principle of least privilege enforced throughout.
#
# Reference: Buildroot makeusers syntax documentation.

########################################
# RBAC / capability groups
# (username '-' => group only, no user created)
########################################

# --- Privilege escalation ---
- -1 wheel      -1 - - - -   Sudo_privilege_escalation

# --- System observation ---
- -1 adm        -1 - - - -   Read_system_logs_and_kernel_messages
- -1 logread    -1 - - - -   Read_application_logs_non-root
- -1 log        -1 - - - -   Write_to_log_sockets_and_files
- -1 audit      -1 - - - -   Access_audit_trail_and_evidence_export

# --- Network ---
- -1 netdev     -1 - - - -   Network_interface_configuration
- -1 netfilter  -1 - - - -   Firewall_and_packet_filter_rules

# --- Hardware buses ---
- -1 gpio       -1 - - - -   GPIO_device_access
- -1 i2c        -1 - - - -   I2C_bus_device_access
- -1 spi        -1 - - - -   SPI_bus_device_access
- -1 serial     -1 - - - -   UART_and_serial_port_access
- -1 can        -1 - - - -   CAN_bus_device_access

# --- Security hardware ---
- -1 tpm        -1 - - - -   TPM2_device_node_access
- -1 crypto     -1 - - - -   Hardware_crypto_accelerator_access

# --- System services ---
- -1 update     -1 - - - -   Trigger_OTA_or_offline_software_updates
- -1 storage    -1 - - - -   Block_device_and_storage_management
- -1 watchdog   -1 - - - -   Watchdog_device_write_access
- -1 time       -1 - - - -   System_clock_and_time_adjustment

########################################
# Human / interactive users  (UID ≥ 1000)
# All accounts: SSH-key authentication only ('!'), password login disabled.
########################################

# admin — full system administration via sudo; SSH-key only
# Groups: wheel (sudo), adm (logs), netdev (networking), audit (compliance)
admin    -2 admin    -2 !  /home/admin    /bin/sh  wheel,adm,netdev,audit        System_Administrator

# operator — day-to-day operations; read-only observability, no hardware access
# Groups: adm (logs), logread (app logs)
operator -2 operator -2 !  /home/operator /bin/sh  adm,logread                  Operations_User

# maint — field/bench maintenance; hardware bus access for on-site diagnostics
# Groups: adm, update (trigger updates), full hardware bus access, serial/CAN for bench tools
maint    -2 maint    -2 !  /home/maint    /bin/sh  adm,update,gpio,i2c,spi,serial,can  Maintenance_Engineer

# viewer — read-only monitoring; WebUI only, no interactive shell
# Groups: logread only
viewer   -2 viewer   -2 *  -              -        logread                       Readonly_Monitoring_Viewer

# auditor — compliance/evidence export; WebUI only, no interactive shell
# Groups: audit (evidence), logread (app logs)
auditor  -2 auditor  -2 *  -              -        audit,logread                 Security_Compliance_Auditor

########################################
# System / service accounts  (UID 100–999)
# All: password fully disabled ('*'), no interactive shell ('-' => /bin/false).
# Home directories are service-owned data directories, not interactive homes.
########################################

# app — main application daemon
# Needs hardware buses for sensors/actuators and crypto HW for secure comms
app      -1 app      -1 *  /var/lib/app       -  gpio,i2c,spi,can,crypto        Main_Application_Daemon

# webui — WebUI backend service (e.g. lighttpd, Nginx, custom server)
# Read-only log access; no hardware or network config rights
webui    -1 webui    -1 *  /var/lib/webui     -  logread                        WebUI_Backend_Service

# logger — centralised log collector/forwarder (syslog-ng, rsyslog, etc.)
# Needs adm to read kernel ring buffer and log for writing to log sockets
logger   -1 logger   -1 *  /var/lib/logger    -  adm,log                        Log_Collector_and_Forwarder

# updater — OTA/offline update agent (RAUC, Mender, SWUpdate, etc.)
# Needs update group to gate update triggers and storage for partition writes
updater  -1 updater  -1 *  /var/lib/updater   -  update,storage                 OTA_Update_Agent

# netmgr — network manager daemon (ConnMan, NetworkManager, etc.)
# Needs both interface config and firewall rule management
netmgr   -1 netmgr   -1 *  /var/lib/netmgr    -  netdev,netfilter               Network_Manager_Daemon

# timesync — NTP/PTP time synchronisation daemon (chrony, ntpd, ptp4l, etc.)
# Note: avoid hyphen in username for maximum toolchain compatibility
timesync -1 timesync -1 *  /var/lib/timesync  -  time                           Time_Synchronisation_Service

# watchdogd — hardware watchdog feeder daemon (/dev/watchdog)
# Only needs the watchdog group; nothing else
watchdogd -1 watchdogd -1 * /var/lib/watchdogd - watchdog                       Hardware_Watchdog_Feeder_Daemon

# tpmd — TPM2 resource manager / access broker (tpm2-abrmd, or swtpm for emulation)
# Mediates all access to /dev/tpm0 and /dev/tpmrm0
tpmd     -1 tpmd     -1 *  /var/lib/tpmd      -  tpm,crypto                     TPM2_Resource_Manager

# diag — diagnostics and metrics collector (health checks, telemetry, BIST)
# Needs read access to logs and all hardware buses for self-test routines
diag     -1 diag     -1 *  /var/lib/diag      -  adm,gpio,i2c,spi,can           Diagnostics_and_Metrics_Collector

# sshd — OpenSSH privilege-separation account
# MANDATORY for sshd privsep (UsePrivilegeSeparation yes in sshd_config)
# Must have no shell, no groups, and an empty (not missing) home: /var/empty
sshd     -1 sshd     -1 *  /var/empty         -  -                              OpenSSH_Privilege_Separation_Account