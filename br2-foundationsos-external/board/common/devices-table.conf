# device_table.txt
# Buildroot device table (makedevs syntax)
#
# Columns:
#   <name> <type> <mode> <uid> <gid> <major> <minor> <start> <inc> <count>
#
# Types:
#   f  regular file          d  directory
#   c  character device      b  block device
#   p  named FIFO/pipe
#
# Counted entries (start / inc / count ≠ '-'):
#   Creates <count> nodes named <name><start+i> with minor <minor + i*inc>.
#   Example:
#     /dev/ttyS  c 660 0 serial 4 64 0 1 4
#     → /dev/ttyS0 (minor 64), ttyS1 (65), ttyS2 (66), ttyS3 (67)
#
# uid / gid:
#   Numeric 0 = root.  Symbolic names are resolved from users-table.txt at
#   build time by Buildroot's makeusers infrastructure.
#
# ┌─ Dynamic-major notice ───────────────────────────────────────────────────┐
# │ Some subsystems (GPIO chardev ≥ 4.8, TPM ≥ 4.12, watchdog multi-dev,   │
# │ etc.) allocate their major via alloc_chrdev_region(); the value varies   │
# │ between kernels and board BSPs.                                           │
# │ • With devtmpfs (strongly recommended): the kernel auto-creates nodes;   │
# │   this table then OVERRIDES ownership and mode only — major/minor values │
# │   in these entries must still match what the kernel registered.           │
# │ • With a fully static /dev: all majors must be manually verified via     │
# │   `grep <subsystem> /proc/devices` on a running reference target.        │
# │ Entries that use dynamic majors are flagged with: [VERIFY MAJOR]         │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Security posture:
#   • Service data dirs: mode 750 — daemon-rwx, primary-group-rx, world-none.
#   • Runtime dirs:      mode 750 — same principle; sockets and PID files stay
#                        invisible to unprivileged processes.
#   • Log dirs:          mode 750, owned by logger:log (writers) or
#                        logger:audit (audit trail), so auditor/adm can read
#                        via group membership without having world-read.
#   • /var/empty:        mode 711, owned by root — OpenSSH privsep chroot jail;
#                        must always be empty and never writable by anyone else.
#   • /tmp, /var/tmp:    mode 1777 (sticky) — standard shared writable areas.
#   • Sensitive devices: mode 600/640, owned by the single daemon that mediates
#                        access (tpmd, watchdogd, …); no other account opens the
#                        node directly.
#
# Companion file: users-table.txt  (defines every uid/gid name used below).
#
# Reference: Buildroot manual §25.2 "Customizing the generated filesystem".


########################################
# 1.  Base filesystem structure
########################################
/tmp                 d 1777  0    0          -    -    -   -   -
/var                 d 755   0    0          -    -    -   -   -
/var/tmp             d 1777  0    0          -    -    -   -   -
/var/empty           d 711   0    0          -    -    -   -   -
/var/lib             d 755   0    0          -    -    -   -   -
/var/log             d 750   0    adm        -    -    -   -   -
/var/run             d 755   0    0          -    -    -   -   -
/run                 d 755   0    0          -    -    -   -   -
/home                d 755   0    0          -    -    -   -   -


########################################
# 2.  Standard pseudo / virtual devices
########################################
/dev                 d 755   0    0          -    -    -   -   -
/dev/null            c 666   0    0          1    3    -   -   -
/dev/zero            c 666   0    0          1    5    -   -   -
/dev/full            c 666   0    0          1    7    -   -   -
# /dev/random is intentionally 444 — world-readable is safe; writes need CAP_SYS_ADMIN
/dev/random          c 444   0    0          1    8    -   -   -
/dev/urandom         c 666   0    0          1    9    -   -   -
/dev/tty             c 666   0    0          5    0    -   -   -
/dev/console         c 600   0    0          5    1    -   -   -
/dev/ptmx            c 666   0    0          5    2    -   -   -

# /dev/mem: restrict to root:adm; harden further in kernel with
#   CONFIG_STRICT_DEVMEM=y and CONFIG_IO_STRICT_DEVMEM=y.
/dev/mem             c 640   0    adm        1    1    -   -   -

# /dev/kmem: should be ABSENT on a secured build (CONFIG_DEVKMEM=n).
#   If your kernel forces it on, restrict it here; otherwise remove this line.
/dev/kmem            c 640   0    adm        1    2    -   -   -


########################################
# 3.  Security / trust devices
########################################

# Hardware RNG — misc device (major 10, minor 183)
# Owned by root:crypto; other services obtain entropy via getrandom(2) or
# /dev/urandom — they never need direct access to /dev/hwrng.
/dev/hwrng           c 640   0    crypto     10   183  -   -   -

# TPM 2.0
#   Kernel < 4.12  : major 10 (misc), minor 224. Single legacy device.
#   Kernel ≥ 4.12  : major dynamically allocated. [VERIFY MAJOR]
#                    Commonly 253 or 10 depending on the BSP.
#   Access policy  : tpmd is the ONLY account that opens these nodes directly.
#                    All other services use tpmd via D-Bus (tpm2-abrmd) or
#                    open /dev/tpmrm0 under the in-kernel resource manager.
/dev/tpm0            c 600   tpmd  tpm        10   224  -   -   -
# /dev/tpmrm0 — in-kernel RM (Linux ≥ 4.12); minor is tpm0_minor + 1.  [VERIFY MAJOR/MINOR]
/dev/tpmrm0          c 600   tpmd  tpm        10   225  -   -   -


########################################
# 4.  Watchdog devices
########################################

# Legacy single-watchdog interface (misc, major 10, minor 130)
# Opens are intentionally exclusive (kernel enforces single open); only
# watchdogd should ever open this.
/dev/watchdog        c 600   watchdogd  watchdog   10   130  -   -   -

# Multi-watchdog interface (Linux ≥ 3.5, major 10, minor 128 typical) [VERIFY MINOR]
/dev/watchdog0       c 600   watchdogd  watchdog   10   128  -   -   -


########################################
# 5.  Hardware bus devices
########################################

# --- GPIO character device interface (Linux ≥ 4.8) ---
# Major is dynamically allocated; 254 is typical on ARM (last dynamic slot).  [VERIFY MAJOR]
# Creates /dev/gpiochip0 … /dev/gpiochip3.  Adjust <count> to match your SoC.
/dev/gpiochip        c 660   0    gpio       254  0    0   1   4

# --- I2C (major 89 — static, POSIX-registered) ---
# Creates /dev/i2c-0 … /dev/i2c-3.  Adjust <count> for your board's bus count.
/dev/i2c-            c 660   0    i2c        89   0    0   1   4

# --- SPI (spidev, major 153 — static) ---
# Minor encoding: (bus_number << 8) | chip_select.
# Entries below cover bus 0 CS 0/1 and bus 1 CS 0.  Extend as needed.
/dev/spidev0.0       c 660   0    spi        153  0    -   -   -
/dev/spidev0.1       c 660   0    spi        153  1    -   -   -
/dev/spidev1.0       c 660   0    spi        153  256  -   -   -

# --- UART / serial (major 4, ttyS minor base 64) ---
# Creates /dev/ttyS0 … /dev/ttyS3.  Adjust <count> for your UART count.
/dev/ttyS            c 660   0    serial     4    64   0   1   4

# --- CAN (SocketCAN) ---
# CAN interfaces (can0, can1, …) are NETWORK INTERFACES in Linux SocketCAN,
# not character devices — there are no /dev/canN entries.
# Permissions are enforced via network namespaces and CAP_NET_ADMIN;
# the 'can' RBAC group should gate capability grants in application logic
# (e.g., systemd AmbientCapabilities or a capabilities policy in your init).


########################################
# 6.  Block / storage devices  (updater / storage group)
########################################
# Adapt partition layout and counts to your actual partition scheme.
# The 'updater' daemon is a member of the 'storage' group.
# Mode 660 prevents world-access while allowing root + storage members.

# eMMC whole device (bus 0)
/dev/mmcblk0         b 660   0    storage    179  0    -   -   -
# eMMC partitions /dev/mmcblk0p1 … /dev/mmcblk0p8  (minors 1–8)
/dev/mmcblk0p        b 660   0    storage    179  1    1   1   8

# eMMC boot partitions (hardware boot areas, if exposed by your BSP)
# /dev/mmcblk0boot0   b 600   0    storage    179  16   -   -   -
# /dev/mmcblk0boot1   b 600   0    storage    179  32   -   -   -

# MTD character devices (NOR/NAND raw flash, major 90)
# Even minors = read/write; odd minors = read-only (kernel MTD convention).
# Creates /dev/mtd0 (minor 0), /dev/mtd1 (minor 2), … /dev/mtd7 (minor 14).
/dev/mtd             c 660   0    storage    90   0    0   2   8

# MTD block devices (major 31, minors 0–7)
/dev/mtdblock        b 660   0    storage    31   0    0   1   8


########################################
# 7.  Service runtime directories  (/run/*)
# PID files, Unix-domain sockets, lock files.
# Mode 750: daemon owns, group = daemon's primary group, world = no access.
########################################
/run/app             d 750   app        app        -    -    -   -   -
/run/webui           d 750   webui      webui      -    -    -   -   -
/run/logger          d 750   logger     logger     -    -    -   -   -
/run/updater         d 750   updater    updater    -    -    -   -   -
/run/netmgr          d 750   netmgr     netmgr     -    -    -   -   -
/run/timesync        d 750   timesync   timesync   -    -    -   -   -
/run/watchdogd       d 750   watchdogd  watchdogd  -    -    -   -   -
/run/tpmd            d 750   tpmd       tpmd       -    -    -   -   -
/run/diag            d 750   diag       diag       -    -    -   -   -


########################################
# 8.  Service data directories  (/var/lib/*)
# Persistent state, databases, certificates, cached config.
# Same 750 posture as runtime dirs.
########################################
/var/lib/app         d 750   app        app        -    -    -   -   -
/var/lib/webui       d 750   webui      webui      -    -    -   -   -
/var/lib/logger      d 750   logger     logger     -    -    -   -   -
/var/lib/updater     d 750   updater    updater    -    -    -   -   -
/var/lib/netmgr      d 750   netmgr     netmgr     -    -    -   -   -
/var/lib/timesync    d 750   timesync   timesync   -    -    -   -   -
/var/lib/watchdogd   d 750   watchdogd  watchdogd  -    -    -   -   -
/var/lib/tpmd        d 750   tpmd       tpmd       -    -    -   -   -
/var/lib/diag        d 750   diag       diag       -    -    -   -   -


########################################
# 9.  Log directories  (/var/log/*)
# Written exclusively by the logger daemon (primary group: log).
# adm-group members can read top-level /var/log; per-service subdirs are
# further scoped so world-read is prevented.
# The audit subdir is owned with group 'audit' so auditor can read it
# without being in the 'log' write group.
########################################
/var/log/app         d 750   logger   log    -    -    -   -   -
/var/log/webui       d 750   logger   log    -    -    -   -   -
/var/log/updater     d 750   logger   log    -    -    -   -   -
/var/log/netmgr      d 750   logger   log    -    -    -   -   -
/var/log/diag        d 750   logger   log    -    -    -   -   -
/var/log/timesync    d 750   logger   log    -    -    -   -   -
# Audit trail: group 'audit' gives read access to auditor without write rights.
/var/log/audit       d 750   logger   audit  -    -    -   -   -


########################################
# 10.  Interactive user home directories
########################################
/home/admin          d 700   admin    admin    -  -    -   -   -
/home/operator       d 700   operator operator -  -    -   -   -
/home/maint          d 700   maint    maint    -  -    -   -   -

# SSH authorised-keys directories (populated by provisioning / key ceremony)
# Mode 700 is REQUIRED by sshd's StrictModes (world/group-write = key rejected).
/home/admin/.ssh     d 700   admin    admin    -  -    -   -   -
/home/operator/.ssh  d 700   operator operator -  -    -   -   -
/home/maint/.ssh     d 700   maint    maint    -  -    -   -   -


########################################
# 11.  SSH / PKI configuration directories
########################################

# OpenSSH privilege-separation chroot jail.
# MUST be: owned root:root, mode 711, and always empty.
# Any file inside /var/empty causes sshd to abort at startup.
# Already declared in §1 above; repeated here for documentation clarity only.
# /var/empty  d 711  0  0  -  -  -  -  -   ← declared in section 1

# SSH host-key directory.
# Individual host keys (ssh_host_*_key) must be 600 root:root — apply via a
# Buildroot filesystem overlay or a post-build script; makedevs cannot set
# per-file permissions on files that don't yet exist at table-parse time.
/etc/ssh             d 755   0    0          -    -    -   -   -

# TLS / PKI material.
# /etc/ssl/private: private key store; mode 710 — root-rw, crypto group
#   can traverse (x) but cannot list (no r) → key files stay invisible to
#   non-root unless explicitly opened by a member of 'crypto'.
/etc/ssl             d 755   0    0          -    -    -   -   -
/etc/ssl/private     d 710   0    crypto     -    -    -   -   -
/etc/ssl/certs       d 755   0    0          -    -    -   -   -